<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 backdrop-blur-md bg-primary/80 border-b border-secondary/10">
  <div class="max-w-7xl mx-auto px-6 sm:px-8 h-24 flex items-center justify-between">
    <!-- Brand Logo -->
    <a routerLink="/" (click)="closeMobileMenu()" class="group flex flex-col justify-center focus:outline-none">
      <span class="font-sans text-2xl tracking-[0.25em] text-secondary font-bold uppercase transition-colors duration-300 group-hover:text-accent">
        D–SKETCH
      </span>
      <span class="font-body text-[10px] italic tracking-[0.1em] text-accent/70 transition-colors duration-300 group-hover:text-secondary -mt-1">
        Architecture & Interiors
      </span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="hidden md:flex items-center space-x-10">
      <a routerLink="/" routerLinkActive="text-secondary border-secondary" [routerLinkActiveOptions]="{exact: true}" 
         class="font-sans text-xs tracking-[0.2em] font-medium text-accent/75 hover:text-secondary border-b-2 border-transparent py-2 transition-all duration-300">
        HOME
      </a>
      <a routerLink="/about" routerLinkActive="text-secondary border-secondary"
         class="font-sans text-xs tracking-[0.2em] font-medium text-accent/75 hover:text-secondary border-b-2 border-transparent py-2 transition-all duration-300">
        ABOUT US
      </a>
      <a routerLink="/services" routerLinkActive="text-secondary border-secondary"
         class="font-sans text-xs tracking-[0.2em] font-medium text-accent/75 hover:text-secondary border-b-2 border-transparent py-2 transition-all duration-300">
        SERVICES
      </a>
      <a routerLink="/gallery" routerLinkActive="text-secondary border-secondary"
         class="font-sans text-xs tracking-[0.2em] font-medium text-accent/75 hover:text-secondary border-b-2 border-transparent py-2 transition-all duration-300">
        GALLERY
      </a>
      <a routerLink="/videos" routerLinkActive="text-secondary border-secondary"
         class="font-sans text-xs tracking-[0.2em] font-medium text-accent/75 hover:text-secondary border-b-2 border-transparent py-2 transition-all duration-300">
        VIDEOS
      </a>
      <a routerLink="/contact" routerLinkActive="bg-secondary text-primary border-secondary"
         class="font-sans text-xs tracking-[0.2em] font-medium text-primary bg-secondary px-6 py-3 border border-secondary hover:bg-transparent hover:text-secondary transition-all duration-300 rounded-none">
        CONTACT US
      </a>
    </nav>

    <!-- Mobile Hamburger Toggle -->
    <button (click)="toggleMobileMenu()" class="md:hidden p-2 text-accent focus:outline-none" aria-label="Toggle Navigation">
      <div class="w-6 h-5 relative flex flex-col justify-between">
        <span class="w-full h-0.5 bg-accent transition-all duration-300" [ngClass]="{'transform rotate-45 translate-y-2': isMobileMenuOpen()}"></span>
        <span class="w-full h-0.5 bg-accent transition-all duration-300" [ngClass]="{'opacity-0': isMobileMenuOpen()}"></span>
        <span class="w-full h-0.5 bg-accent transition-all duration-300" [ngClass]="{'transform -rotate-45 -translate-y-2': isMobileMenuOpen()}"></span>
      </div>
    </button>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="md:hidden overflow-hidden transition-all duration-500 ease-in-out border-b border-secondary/10 bg-primary"
       [ngClass]="{'max-h-screen opacity-100 py-6': isMobileMenuOpen(), 'max-h-0 opacity-0 py-0': !isMobileMenuOpen()}">
    <div class="px-6 flex flex-col space-y-5">
      <a routerLink="/" routerLinkActive="text-secondary" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()"
         class="font-sans text-sm tracking-[0.2em] font-medium text-accent/85 py-1 block">
        HOME
      </a>
      <a routerLink="/about" routerLinkActive="text-secondary" (click)="closeMobileMenu()"
         class="font-sans text-sm tracking-[0.2em] font-medium text-accent/85 py-1 block">
        ABOUT US
      </a>
      <a routerLink="/services" routerLinkActive="text-secondary" (click)="closeMobileMenu()"
         class="font-sans text-sm tracking-[0.2em] font-medium text-accent/85 py-1 block">
        SERVICES
      </a>
      <a routerLink="/gallery" routerLinkActive="text-secondary" (click)="closeMobileMenu()"
         class="font-sans text-sm tracking-[0.2em] font-medium text-accent/85 py-1 block">
        GALLERY
      </a>
      <a routerLink="/videos" routerLinkActive="text-secondary" (click)="closeMobileMenu()"
         class="font-sans text-sm tracking-[0.2em] font-medium text-accent/85 py-1 block">
        VIDEOS
      </a>
      <a routerLink="/contact" routerLinkActive="bg-secondary text-primary border-secondary" (click)="closeMobileMenu()"
         class="font-sans text-xs tracking-[0.2em] font-medium text-primary bg-secondary py-3 px-4 border border-secondary hover:bg-transparent hover:text-secondary text-center block transition-all duration-300 rounded-none">
        CONTACT US
      </a>
    </div>
  </div>
</header>
